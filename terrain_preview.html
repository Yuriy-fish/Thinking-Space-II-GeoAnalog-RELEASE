<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoAnalog Terrain Panorama — Working Preview</title>
  <style>
    :root {
      --bg: #07090f;
      --card: #0d1220;
      --border: #1e293b;
      --accent: #4fc3f7;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .title-group h1 {
      font-size: 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-group p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .badge {
      background: rgba(79, 195, 247, 0.15);
      border: 1px solid rgba(79, 195, 247, 0.35);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .controls-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }
    select:focus, button:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .viewport-card {
      width: 100%;
      max-width: 1100px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .info-summary {
      width: 100%;
      max-width: 1100px;
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .info-box {
      background: #0b0e17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .info-box h3 {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .info-box p {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .info-box span {
      font-size: 11px;
      color: #38bdf8;
      display: block;
      margin-top: 2px;
    }
  </style>
  <link rel="stylesheet" href="./src/components/terrain/terrainPanorama.css">
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h1>
        <span>🏔️</span> GeoAnalog Terrain Panorama
        <span class="badge">Phase 3 Preview</span>
      </h1>
      <p>Real DEM Transect Cross-Section with Atmospheric Illumination &amp; Space-Grade HUD</p>
    </div>
    <div class="controls-bar">
      <label style="font-size:12px; color:var(--text-dim);">Analog Station:</label>
      <select id="select-analog"></select>
      <label style="font-size:12px; color:var(--text-dim);">Target Body:</label>
      <select id="select-target">
        <option value="mars" selected>Mars (Burgundy Sky)</option>
        <option value="moon">Moon (Vacuum Black)</option>
        <option value="earth">Earth (Twilight)</option>
      </select>
    </div>
  </div>

  <div class="viewport-card">
    <div id="terrain-viewport"></div>
  </div>

  <div class="info-summary" id="info-summary">
    <div class="info-box">
      <h3>Active Topography Transect</h3>
      <p id="sum-transect-name">—</p>
      <span id="sum-transect-len">—</span>
    </div>
    <div class="info-box">
      <h3>DEM Provider &amp; Vertical Datum</h3>
      <p id="sum-provider">—</p>
      <span id="sum-datum">—</span>
    </div>
    <div class="info-box">
      <h3>Scientific Relief &amp; Slope</h3>
      <p id="sum-relief">—</p>
      <span id="sum-slope">—</span>
    </div>
  </div>

  <script type="module">
    import { TerrainPanorama } from './src/components/terrain/TerrainPanorama.js';
    import { demProfileEngine } from './src/engine/terrain/demProfileEngine.js';
    import earthAnalogsData from './src/data/analogs/earth-analogs.json';

    const container = document.getElementById('terrain-viewport');
    const selectAnalog = document.getElementById('select-analog');
    const selectTarget = document.getElementById('select-target');

    // Populate site selector
    earthAnalogsData.forEach(site => {
      const opt = document.createElement('option');
      opt.value = site.id;
      opt.textContent = `${site.name} (${site.country || site.location})`;
      if (site.id === 'earth-devon-island') opt.selected = true;
      selectAnalog.appendChild(opt);
    });

    // Initialize Panorama Component
    const panorama = new TerrainPanorama(container, {
      targetBody: 'mars',
      verticalExaggeration: 'auto',
      showHud: true,
      showControls: true
    });

    function loadSite(siteId, targetBody) {
      panorama.showLoading();
      setTimeout(() => {
        const profile = demProfileEngine.getProfileForSite(siteId);
        panorama.setOptions({ targetBody });
        panorama.setProfile(profile);

        // Update info summary
        if (profile.status === 'SUCCESS') {
          document.getElementById('sum-transect-name').textContent = profile.transect.name;
          document.getElementById('sum-transect-len').textContent = `Total Length: ${(profile.transect.totalLengthMeters / 1000).toFixed(2)} km (${profile.samples.length} elevation samples)`;
          document.getElementById('sum-provider').textContent = profile.provider.name;
          document.getElementById('sum-datum').textContent = `Vertical Datum: ${profile.provider.verticalDatum} • Horizontal CRS: ${profile.provider.horizontalCrs}`;
          document.getElementById('sum-relief').textContent = `Min: ${profile.statistics.elevation.minElevationMeters} m | Max: ${profile.statistics.elevation.maxElevationMeters} m (Δ ${profile.statistics.elevation.totalReliefMeters} m)`;
          document.getElementById('sum-slope').textContent = `Mean Slope: ${profile.statistics.slope.meanSlopeDeg}° | Max Slope: ${profile.statistics.slope.maxSlopeDeg}°`;
        }
      }, 50);
    }

    selectAnalog.addEventListener('change', () => {
      loadSite(selectAnalog.value, selectTarget.value);
    });

    selectTarget.addEventListener('change', () => {
      loadSite(selectAnalog.value, selectTarget.value);
    });

    // Initial load
    loadSite('earth-devon-island', 'mars');
  </script>
</body>
</html>
